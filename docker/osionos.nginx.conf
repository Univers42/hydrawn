# The osionos build, served alone on its own origin (docker/osionos.Dockerfile).
#
# Every location repeats the headers through one include: nginx drops the server's
# add_header lines in any location that sets its own, so a header set only at the server
# level would vanish exactly on the files that carry a Cache-Control.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  gzip_static on;

  # Content-hashed by Vite: a new build is new names.
  location ^~ /_app/immutable/ {
    include /etc/nginx/hydrawn-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The SPA: any route is index.html, which must be re-read so a deploy is picked up.
  location / {
    include /etc/nginx/hydrawn-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
