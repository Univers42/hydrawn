# CI — the same gate as `make verify`, split into jobs that can run in parallel.
#
# Submodule checkout: `submodules: true`, deliberately NOT `recursive`. The engine is
# cloned over https so the default token is enough, but the engine itself carries an
# SSH-URL submodule (claude-deal-with-the-devil) that a recursive checkout would try
# to fetch over SSH and fail on. Nothing in the build needs it.
name: CI

on:
  pull_request:
  push:
    # `develop` is this repo's integration branch and was missing, so every push to it
    # went ungated — the only runs were on pull requests. `dev` is the engine
    # submodule's name for the same thing; kept so a shared workflow stays portable.
    branches: [main, develop, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 --no-run-if-empty shellcheck -S error

  wasm-freshness:
    name: Stale WASM cannot ship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Needs the crate on disk to point `make -n` at, but builds nothing: the
      # question is whether the dependency graph would rebuild engine/pkg after the
      # crate changes, and answering it must not cost a WASM build.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: A change to the crate must rebuild engine/pkg
        run: bash scripts/assert-wasm-freshness.sh

  wasm:
    name: Build engine WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install wasm-bindgen-cli
        run: |
          # Must match `wasm-bindgen = "=<version>"` in the crate. wasm-build.sh
          # asserts it, so a drift here fails loudly rather than at runtime.
          version=0.2.128
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1
          sudo chmod +x /usr/local/bin/wasm-bindgen

      - name: Build engine/pkg
        run: ENGINE_DIR=engine bash scripts/wasm-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: engine-pkg
          path: engine/pkg
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The typecheck needs engine/pkg: the engine's wasmLoad.ts imports the generated
    # ../pkg/draw_engine.js, so without the artifact svelte-check cannot resolve it.
    needs: wasm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: engine-pkg
          path: engine/pkg

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The web's unit tests need engine/pkg, for the same reason the typecheck does: the
    # front's camera maths is a WASM call now (`@osionos/draw-engine/cameraMath`, the
    # `#[wasm_bindgen]`s on `camera.rs`), and `apps/web/vitest.setup.ts` instantiates the
    # module from its bytes because node cannot fetch a sibling `.wasm` the way a browser
    # does. Without the artifact every web test fails at that setup.
    needs: wasm
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URL: mongodb://localhost:27017
      MONGO_DB: drawnosaurus_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: engine-pkg
          path: engine/pkg

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Live collaboration E2E encryption security
        # Named gate for the threat-model suite (also covered by `pnpm test`).
        # Keeps confidentiality / downgrade / blind-relay invariants visible in CI.
        run: pnpm test:live-e2e-security

      - name: API integration tests against a real MongoDB
        run: pnpm test:integration

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # The suite alone ran 14.4-19.9 min on main (Sept 2026) and 19.3 min on run 38574584839,
    # which 20 cut at 20m10s: the ceiling, not a test, decided the verdict.
    timeout-minutes: 30
    # The specs drive the real engine through a real wheel, so they need the real WASM.
    # Nothing else: every spec stubs /v1/** and the board route falls back to an empty
    # scene, so there is no API and no Mongo here on purpose — a browser test that talks
    # to a database fails for the database's reasons, and then nobody believes it.
    needs: wasm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: engine-pkg
          path: engine/pkg

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: The board library, mounted in a host page under a strict CSP
        # Builds packages/board to dist/ and drives that build, not the source: what ships.
        run: pnpm --filter @hydrawn/board test:browser

      - uses: actions/upload-artifact@v4
        # Traces and screenshots, and only when something failed — they are how you find
        # out what a red browser test actually saw without reproducing it locally.
        if: failure()
        with:
          name: e2e-traces
          path: |
            test-results
            packages/board/test-results
          retention-days: 7

  docker:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # web.Dockerfile consumes engine/pkg from the build context; it carries no Rust
    # toolchain by design.
    needs: wasm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Init engine/realtime (nested; not recursive)
        run: |
          # CI cannot fetch the engine's SSH-URL nested submodule as-is.
          # `--add` is idempotent across re-runs / checkout already setting insteadOf.
          git -C engine config --add url."https://github.com/".insteadOf "git@github.com:"
          git -C engine submodule update --init realtime

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          name: engine-pkg
          path: engine/pkg

      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: drawnosaurus-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          load: true
          tags: drawnosaurus-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build the realtime image
        uses: docker/build-push-action@v6
        with:
          context: ./engine/realtime
          # Workspace-relative (build-push-action); not under the build context.
          file: ./docker/realtime.Dockerfile
          push: false
          load: true
          tags: drawnosaurus-realtime:ci
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,scope=realtime,mode=max

      - name: Smoke-test the api and realtime images
        run: |
          # Proves the images boot and answer, which a build alone does not.
          docker network create ci-net
          docker run -d --name ci-mongo --network ci-net mongo:7
          docker run -d --name ci-api --network ci-net \
            -e MONGO_URL=mongodb://ci-mongo:27017 -p 4000:4000 drawnosaurus-api:ci
          docker run -d --name ci-realtime --network ci-net \
            -e REALTIME_AUTH=noauth -e REALTIME_HOST=0.0.0.0 -e REALTIME_PORT=4000 \
            -p 4402:4000 drawnosaurus-realtime:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/healthz >/dev/null 2>&1 \
              && curl -fsS http://localhost:4402/v1/health >/dev/null 2>&1; then
              echo "api + realtime up after ${attempt} attempt(s)"
              curl -fsS http://localhost:4000/readyz
              curl -fsS http://localhost:4402/v1/health
              exit 0
            fi
            sleep 2
          done

          echo "api or realtime never became healthy" >&2
          docker logs ci-api >&2
          docker logs ci-realtime >&2
          exit 1
